name: Python

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.11'
          activate-environment: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python -c "import os, tomllib; version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']; assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'tag must match Cargo.toml version'"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust tests
        run: |
          PYTHONHOME="$(python -c 'import sys; print(sys.base_prefix)')" cargo test --locked --lib

  wheels:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.11'
          activate-environment: true
      - uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: v1.16.0
          rust-toolchain: stable
          target: ${{ matrix.target }}
          manylinux: '2014'
          args: --release --locked --out dist --compatibility pypi --interpreter ${{ runner.os == 'Linux' && 'python3.11' || 'python' }}
      - name: Test wheel on Python 3.11
        run: |
          uv pip install --python python --no-deps --no-index --find-links dist boko-ebook
          python -m unittest discover -s tests -v
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.15'
          activate-environment: true
          venv-path: ${{ runner.temp }}/python315
      - name: Test wheel on Python 3.15
        run: |
          uv pip install --python python --no-deps --no-index --find-links dist boko-ebook
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.11'
          activate-environment: true
      - uses: dtolnay/rust-toolchain@stable
      - run: uv build --sdist
      - name: Rebuild and test source distribution
        run: |
          uv pip install --python python --no-deps dist/*.tar.gz
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [check, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.3
