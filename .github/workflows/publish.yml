name: Publish

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/python.yml

  publish:
    name: Publish to PyPI and GitHub
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/boko-ebook
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: sdist
          path: dist
      - uses: astral-sh/attest-action@v0.0.7
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
        env:
          UV_PUBLISH_CHECK_URL: https://pypi.org/simple/
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
